; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test

[env:esp32dev]
; Pinned for reproducible builds. espressif32 7.0.1 resolves to
; framework-arduinoespressif32 3.20017 (Arduino-ESP32 core 2.0.17, ESP-IDF 4.4.x).
; The firmware uses the core 2.x / IDF 4.4 wifi_provisioning API (WIFI_PROV_*).
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; BLE provisioning (Bluedroid + ESP-IDF wifi_provisioning) does not fit the default 1.25 MB app
; slot. min_spiffs keeps the OTA layout (2 x 1.875 MB app slots) and the same
; NVS offset/size as default.csv, so stored Wi-Fi credentials and the pairing
; code survive the switch; SPIFFS shrinks to 128 KB (unused by this firmware).
board_build.partitions = min_spiffs.csv
; Errors only. Level 5 would log the provisioned Wi-Fi password; levels 3-4
; flood the pairing UART. firmware/src/config.h refuses to build with >= 3.
; -u btStarted forces esp32-hal-bt.c into the link so its strong btInUse()
; (returning true) replaces the weak one; otherwise initArduino() releases the
; BT memory before setup() and BLE provisioning can never start.
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-Wl,-u,btStarted

lib_deps = 
	; Pinned to the exact version whose Server::publish delivery (to subscribed
	; clients only, QoS 0, never retained) resmon/status was verified against.
	mlesniew/PicoMQTT @ 1.3.0
	; Pinned to the 2023-08-03 commit: later commits call the Arduino core 3.x
	; analogWriteResolution(pin, bits) API and fail to build on core 2.0.17.
	https://github.com/DFRobot/DFRobot_GP8XXX.git#03a8fb001fde48c0ff15b8e74c07335ef3da3fb6
